  </defs>
  <use href="#body" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="164" fill="#FFFFFF" fill-opacity="0.035"/>
    <rect x="100" y="264" width="824" height="660" fill="url(#dots)"/>
  </g>
  <line x1="100" y1="264" x2="924" y2="264" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  <circle cx="194" cy="182" r="24" fill="#FF3030"/>
  <rect x="246" y="172" width="136" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.26"/>
  <polyline points="300,454 452,594 300,734" fill="none" stroke="#F5F5F5" stroke-width="64" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="540" y="716" width="230" height="64" fill="#FF3030"/>
  <use href="#body" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
</svg>
