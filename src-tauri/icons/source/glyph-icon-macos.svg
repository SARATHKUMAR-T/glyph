<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Glyph app icon, macOS master: 824px body on the 1024 Apple icon grid. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1A1E"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="4.5" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <path id="body" d="M100,390 C100,170 170,100 390,100 H634 C854,100 924,170 924,390 V634 C924,854 854,924 634,924 H390 C170,924 100,854 100,634 Z"/>
