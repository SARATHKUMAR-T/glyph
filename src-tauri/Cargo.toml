[package]
name = "glyph-terminal"
version = "0.2.3"
description = "A Nothing-inspired Linux terminal emulator."
authors = ["Aximsoft"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nothing_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "glyph"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
open = "5"
sysinfo = "0.36.1"
# Rust-owned VT parser + grid state for the WebGL2/Canvas2D renderer
# path (see src/terminal/engine), the terminal's sole rendering pipeline.
alacritty_terminal = "0.26.0"

