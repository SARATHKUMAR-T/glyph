[package]
name = "nothing-terminal"
version = "0.1.0"
description = "A Nothing-inspired Linux terminal emulator."
authors = ["Aximsoft"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nothing_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
